
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Hundred Eyes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at center, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.64) 68%, rgba(0, 0, 0, 0.28));
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at 50% 50%, rgba(0, 120, 160, 0.028), transparent 28%),
        radial-gradient(circle at 20% 25%, rgba(0, 70, 130, 0.022), transparent 24%),
        radial-gradient(circle at 80% 75%, rgba(0, 100, 90, 0.02), transparent 26%),
        #000;
      font-family: Inter, system-ui, sans-serif;
    }

    .grid-wrap,
    .grain,
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .grid-wrap {
      z-index: 1;
      display: grid;
      place-items: center;
      padding: clamp(14px, 2vw, 26px);
    }

    .grid {
      width: min(96vw, 1500px);
      height: min(96vh, 1500px);
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: clamp(6px, 0.65vw, 12px);
    }

    .cell {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.022), rgba(255,255,255,0.006)),
        rgba(255,255,255,0.008);
      border: 1px solid rgba(180, 235, 255, 0.035);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.02),
        inset 0 -1px 0 rgba(255,255,255,0.008),
        inset 0 0 28px rgba(255,255,255,0.008),
        0 0 0 1px rgba(0,0,0,0.22);
      backdrop-filter: blur(14px) saturate(115%);
      -webkit-backdrop-filter: blur(14px) saturate(115%);
    }

    .cell::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.018), transparent 36%),
        radial-gradient(circle at 78% 24%, rgba(255,255,255,0.018), transparent 16%);
      opacity: 0.45;
    }

    .cell::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 26px rgba(0, 0, 0, 0.42);
    }

    .iris {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--size);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.72) rotate(var(--rotate));
      opacity: 0;
      mix-blend-mode: screen;
      filter:
        blur(0.12px)
        drop-shadow(0 0 10px rgba(95, 220, 255, 0.10))
        drop-shadow(0 0 24px rgba(0, 120, 180, 0.07));
      animation: irisLife var(--life) ease-in-out forwards;
    }

    .iris.mass-iris {
      animation: massEyeLife var(--life) ease-in-out forwards;
    }

    .iris::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle, #000 0 16%, transparent 17%),
        radial-gradient(circle, transparent 0 26%, rgba(205,245,255,var(--ring-alpha)) 27%, transparent 29%),
        repeating-conic-gradient(
          from var(--spin),
          rgba(185, 245, 255, var(--fiber-bright)) 0deg 0.45deg,
          rgba(40, 145, 190, var(--fiber-dim)) 0.7deg 1.9deg,
          transparent 2.15deg 4.8deg
        ),
        radial-gradient(
          circle,
          rgba(45, 175, 215, var(--core-alpha)) 0 34%,
          rgba(5, 20, 30, 0.72) 56%,
          transparent 72%
        );
      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.05),
        inset 0 0 56px rgba(0,0,0,0.94);
      mask-image: radial-gradient(circle, black 0 64%, transparent 73%);
      animation: irisPulse var(--life) ease-in-out forwards;
    }

    .iris::after {
      content: "";
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      background:
        conic-gradient(
          from calc(var(--spin) * -1),
          transparent 0 12deg,
          rgba(150, 238, 255, var(--halo-alpha)) 13deg 15deg,
          transparent 16deg 38deg,
          rgba(40, 120, 180, calc(var(--halo-alpha) * 0.8)) 39deg 41deg,
          transparent 42deg 70deg,
          rgba(180, 245, 255, calc(var(--halo-alpha) * 0.75)) 71deg 73deg,
          transparent 74deg 360deg
        );
      mask-image: radial-gradient(circle, transparent 0 42%, black 43% 60%, transparent 63%);
      opacity: 0.42;
      animation: slowTurn calc(var(--life) * 2.1) linear infinite;
    }

    .blink,
    .iris .blink {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      z-index: 2;
    }

    .group-blink {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--size);
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      z-index: 5;
      transform: translate(-50%, -50%) scale(1) rotate(var(--rotate));
    }

    .blink::before,
    .blink::after,
    .group-blink::before,
    .group-blink::after {
      content: "";
      position: absolute;
      left: -12%;
      width: 124%;
      height: 76%;
      background: #000;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
    }

    .blink::before,
    .group-blink::before {
      top: -58%;
      transform: translateY(-100%);
    }

    .blink::after,
    .group-blink::after {
      bottom: -58%;
      transform: translateY(100%);
    }

    .blink::before {
      animation: upperBlink var(--life) ease-in-out forwards;
    }

    .blink::after {
      animation: lowerBlink var(--life) ease-in-out forwards;
    }

    .group-blink::before {
      animation: groupUpperBlink var(--blink-duration, 720ms) ease-in-out forwards;
    }

    .group-blink::after {
      animation: groupLowerBlink var(--blink-duration, 720ms) ease-in-out forwards;
    }

    .anomaly {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 76%;
      height: 88%;
      transform: translate(-50%, -50%);
      border-radius: 44% 44% 48% 48%;
      opacity: 0;
      background:
        radial-gradient(ellipse at 50% 32%, rgba(180,220,245,0.085), transparent 32%),
        radial-gradient(ellipse at 37% 38%, rgba(210,240,255,0.07), transparent 7%),
        radial-gradient(ellipse at 63% 38%, rgba(210,240,255,0.07), transparent 7%),
        radial-gradient(ellipse at 50% 61%, rgba(255,255,255,0.03), transparent 6%),
        linear-gradient(to bottom, transparent 0 48%, rgba(0,0,0,0.82) 100%);
      filter: blur(1.5px);
      mix-blend-mode: screen;
      animation: anomalyLife var(--life) ease-in-out forwards;
    }

    .grain {
      z-index: 3;
      opacity: 0.075;
      mix-blend-mode: screen;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='220' height='220' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E");
    }

    .vignette {
      z-index: 4;
      background:
        radial-gradient(circle at center, transparent 0 42%, rgba(0,0,0,0.30) 66%, rgba(0,0,0,0.96) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.84), transparent 42%, rgba(0,0,0,0.90));
    }

    @keyframes irisLife {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.62) rotate(var(--rotate));
      }
      12% {
        opacity: var(--opacity);
        transform: translate(-50%, -50%) scale(1) rotate(var(--rotate));
      }
      72% {
        opacity: var(--opacity);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.88) rotate(var(--rotate));
      }
    }

    @keyframes massEyeLife {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.62) rotate(var(--rotate));
      }
      18% {
        opacity: var(--opacity);
        transform: translate(-50%, -50%) scale(1) rotate(var(--rotate));
      }
      72% {
        opacity: var(--opacity);
        transform: translate(-50%, -50%) scale(1) rotate(var(--rotate));
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.86) rotate(var(--rotate));
      }
    }

    @keyframes irisPulse {
      0%, 100% {
        transform: scale(0.975);
        filter: brightness(0.78);
      }
      50% {
        transform: scale(1.03);
        filter: brightness(1.05);
      }
    }

    @keyframes slowTurn {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes upperBlink {
      0%, 28%   { transform: translateY(-100%); }
      34%, 41%  { transform: translateY(78%); }
      47%, 80%  { transform: translateY(-100%); }
      87%, 93%  { transform: translateY(78%); }
      100%      { transform: translateY(-100%); }
    }

    @keyframes lowerBlink {
      0%, 28%   { transform: translateY(100%); }
      34%, 41%  { transform: translateY(-78%); }
      47%, 80%  { transform: translateY(100%); }
      87%, 93%  { transform: translateY(-78%); }
      100%      { transform: translateY(100%); }
    }

    @keyframes groupUpperBlink {
      0%, 100% { transform: translateY(-100%); }
      40%, 62% { transform: translateY(78%); }
    }

    @keyframes groupLowerBlink {
      0%, 100% { transform: translateY(100%); }
      40%, 62% { transform: translateY(-78%); }
    }

    @keyframes anomalyLife {
      0%, 22% {
        opacity: 0;
      }
      34%, 58% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @media (max-width: 900px) {
      .grid {
        gap: 6px;
      }

      .cell {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="grain"></div>
  <div class="vignette"></div>

  <script>
    const grid = document.getElementById("grid");
    const totalCells = 100;
    const maxActiveEyes = 6;
    const groupBlinkChance = 0.05;
    let isMassBlinking = false;
    const activeCells = new Set();
    const cells = [];

    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.index = i;
      grid.appendChild(cell);
      cells.push(cell);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function chance(probability) {
      return Math.random() < probability;
    }

    function randomInactiveCellIndices() {
      const indices = [];
      for (let i = 0; i < totalCells; i++) {
        if (!activeCells.has(i)) indices.push(i);
      }
      return indices;
    }

    function setEyeStyle(iris, options = {}) {
      const size = options.size || rand(46, 84).toFixed(0) + "%";
      const life = options.life || rand(4.8, 8.4).toFixed(2) + "s";
      const opacity = options.opacity || rand(0.22, 0.58).toFixed(2);
      const rotate = options.rotate || rand(-8, 8).toFixed(2) + "deg";
      const spin = rand(0, 360).toFixed(0) + "deg";

      iris.style.setProperty("--size", size);
      iris.style.setProperty("--life", life);
      iris.style.setProperty("--opacity", opacity);
      iris.style.setProperty("--rotate", rotate);
      iris.style.setProperty("--spin", spin);

      iris.style.setProperty("--core-alpha", rand(0.42, 0.82).toFixed(2));
      iris.style.setProperty("--fiber-bright", rand(0.28, 0.82).toFixed(2));
      iris.style.setProperty("--fiber-dim", rand(0.08, 0.24).toFixed(2));
      iris.style.setProperty("--ring-alpha", rand(0.05, 0.16).toFixed(2));
      iris.style.setProperty("--halo-alpha", rand(0.08, 0.20).toFixed(2));

      return { size, life, rotate };
    }

    function addCellBlink(cell, size, rotate, duration = 720) {
        const blink = document.createElement("div");
        blink.className = "group-blink";
        blink.style.setProperty("--size", size);
        blink.style.setProperty("--rotate", rotate);
        blink.style.setProperty("--blink-duration", `${duration}ms`);
        cell.appendChild(blink);

        blink.addEventListener("animationend", () => blink.remove(), { once: true });
    }

    function clearEyes() {
      document.querySelectorAll(".iris, .anomaly, .group-blink").forEach((element) => element.remove());
      activeCells.clear();
    }

    function triggerMassBlink() {
      if (isMassBlinking) return;
      isMassBlinking = true;
      clearEyes();

      const massLife = "2.7s";

      cells.forEach((cell) => {
        const iris = document.createElement("div");
        iris.className = "iris mass-iris";
        const eye = setEyeStyle(iris, {
          size: rand(50, 82).toFixed(0) + "%",
          life: massLife,
          opacity: rand(0.34, 0.70).toFixed(2),
          rotate: rand(-5, 5).toFixed(2) + "deg"
        });

        cell.appendChild(iris);
        setTimeout(() => addCellBlink(cell, eye.size, eye.rotate, 820), 920);
      });

      setTimeout(() => {
        clearEyes();
        isMassBlinking = false;
        setTimeout(pulse, rand(500, 900));
      }, 2950);
    }

    function spawnEye(index) {
      if (isMassBlinking) return;
      if (activeCells.has(index)) return;
      if (activeCells.size >= maxActiveEyes) return;

      const cell = cells[index];
      activeCells.add(index);

      const iris = document.createElement("div");
      iris.className = "iris";

      const eye = setEyeStyle(iris);

      iris.innerHTML = `<div class="blink"></div>`;
      cell.appendChild(iris);

      let anomaly = null;

      if (chance(0.035)) {
        anomaly = document.createElement("div");
        anomaly.className = "anomaly";
        anomaly.style.setProperty("--life", eye.life);
        cell.appendChild(anomaly);
      }

      const lifeMs = parseFloat(eye.life) * 1000;

      setTimeout(() => {
        iris.remove();
        if (anomaly) anomaly.remove();
        activeCells.delete(index);
      }, lifeMs + 250);
    }

    function pulse() {
      if (isMassBlinking) return;

      if (chance(groupBlinkChance)) {
        triggerMassBlink();
        return;
      }

      const free = randomInactiveCellIndices();

      if (!free.length || activeCells.size >= maxActiveEyes) {
        setTimeout(pulse, rand(700, 1300));
        return;
      }

      const burst = chance(0.18);
      const desiredCount = burst ? Math.floor(rand(2, 4)) : 1;
      const availableSlots = maxActiveEyes - activeCells.size;
      const count = Math.min(desiredCount, free.length, availableSlots);

      for (let i = 0; i < count; i++) {
        const pickIndex = Math.floor(Math.random() * free.length);
        const cellIndex = free.splice(pickIndex, 1)[0];
        setTimeout(() => spawnEye(cellIndex), i * rand(240, 520));
      }

      setTimeout(pulse, burst ? rand(1800, 3200) : rand(1200, 2400));
    }

    pulse();
  </script>
</body>
</html>
